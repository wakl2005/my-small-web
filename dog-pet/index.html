<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线条小狗桌宠</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden;
        }
        .dog {
            width: 100px;
            height: 150px;
            position: relative;
        }
        .head {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #333;
            position: absolute;
            top: 0;
            left: 25px;
        }
        .body {
            width: 100px;
            height: 80px;
            background-color: #333;
            position: absolute;
            top: 50px;
            left: 0;
        }
        .tail {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #333;
            position: absolute;
            top: 100px;
            left: 70px;
            animation: wag 1s infinite alternate;
        }
        @keyframes wag {
            from {
                transform: rotate(10deg);
            }
            to {
                transform: rotate(-10deg);
            }
        }
        .eye {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: white;
            position: absolute;
            top: 15px;
        }
        .eye.left {
            left: 15px;
        }
        .eye.right {
            right: 15px;
        }
        .mouth {
            width: 20px;
            height: 10px;
            border-radius: 10px;
            background-color: white;
            position: absolute;
            top: 30px;
            left: 15px;
        }
    </style>
</head>
<body>
    <div class="dog">
        <div class="head">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
        </div>
        <div class="body"></div>
        <div class="tail"></div>
    </div>
    <script>
        document.addEventListener('mousemove', function(event) {
            const dog = document.querySelector('.dog');
            const x = event.clientX / window.innerWidth * 100;
            const y = event.clientY / window.innerHeight * 100;
            dog.style.transform = `translate(${x - 50}%, ${y - 75}%)`;
        });
    </script>
</body>
</html>
