<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>瞄准射击 · Aim Trainer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1b2735 0%, #090e17 100%);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    cursor: none;
    user-select: none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 48px;
    padding: 18px 0;
    z-index: 50; pointer-events: none;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 12px; letter-spacing: 3px; color: #5f7b9e; text-transform: uppercase; }
  .hud-value { font-size: 34px; font-weight: 700; color: #e8f1ff; font-variant-numeric: tabular-nums; }
  #time.low { color: #ff5566; animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* ---------- 靶子 ---------- */
  .target {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    animation: pop .18s cubic-bezier(.2, 1.6, .4, 1) forwards;
    z-index: 10;
  }
  @keyframes pop { to { transform: translate(-50%, -50%) scale(1); } }
  .target .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle,
        #ffdd33 0% 18%,
        #e33 18% 40%,
        #fff 40% 62%,
        #e33 62% 84%,
        #7a0d0d 84% 100%);
    box-shadow: 0 0 18px rgba(255, 60, 60, .55), inset 0 0 8px rgba(0,0,0,.4);
    transition: transform .08s;
  }
  .target:hover .ring { transform: scale(1.08); }

  .target.hit { animation: shatter .22s ease-out forwards; pointer-events: none; }
  @keyframes shatter {
    to { transform: translate(-50%, -50%) scale(1.9); opacity: 0; filter: brightness(3); }
  }

  /* 命中火花 */
  .spark {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ffd34d;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 40;
    animation: fly .38s ease-out forwards;
  }
  @keyframes fly {
    to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2); opacity: 0; }
  }
  .score-pop {
    position: absolute;
    transform: translate(-50%, -50%);
    color: #ffd34d; font-weight: 800; font-size: 22px;
    pointer-events: none; z-index: 40;
    text-shadow: 0 0 8px rgba(255,180,0,.8);
    animation: rise .5s ease-out forwards;
  }
  @keyframes rise {
    to { transform: translate(-50%, calc(-50% - 46px)); opacity: 0; }
  }

  /* ---------- 准星 ---------- */
  #crosshair {
    position: fixed;
    width: 34px; height: 34px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;
    transition: transform .06s;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: #4ade80;
    box-shadow: 0 0 6px rgba(74,222,128,.9);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair .dot {
    position: absolute; left: 50%; top: 50%;
    width: 5px; height: 5px; border-radius: 50%;
    background: #4ade80; transform: translate(-50%, -50%);
  }
  #crosshair .ring-c {
    position: absolute; inset: 4px;
    border: 2px solid rgba(74,222,128,.85);
    border-radius: 50%;
  }
  #crosshair.hot { transform: translate(-50%,-50%) scale(1.35) rotate(45deg); }

  /* ---------- 开始 / 结束遮罩 ---------- */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(6, 10, 18, .82);
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px; z-index: 200;
    cursor: none;
  }
  #overlay h1 {
    font-size: 52px; color: #fff; letter-spacing: 6px;
    text-shadow: 0 0 24px rgba(239,68,68,.7);
  }
  #overlay p { color: #8ea6c8; font-size: 16px; line-height: 1.9; text-align: center; }
  #final { font-size: 20px; color: #ffd34d; font-weight: 700; display: none; }
  #startBtn {
    pointer-events: auto;
    padding: 14px 58px;
    font-size: 20px; font-weight: 700; letter-spacing: 4px;
    color: #08110b; background: linear-gradient(135deg, #4ade80, #22c55e);
    border: none; border-radius: 999px;
    cursor: none;
    box-shadow: 0 0 26px rgba(74,222,128,.45);
    transition: transform .15s;
  }
  #startBtn:hover { transform: scale(1.07); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-item"><div class="hud-label">得分 SCORE</div><div class="hud-value" id="score">0</div></div>
  <div class="hud-item"><div class="hud-label">时间 TIME</div><div class="hud-value" id="time">30</div></div>
  <div class="hud-item"><div class="hud-label">命中/秒</div><div class="hud-value" id="rate">0.0</div></div>
</div>

<div id="crosshair"><div class="ring-c"></div><div class="dot"></div></div>

<div id="overlay">
  <h1>🎯 瞄准射击</h1>
  <p>把准星移到靶子上即可击中，无需点击！<br/>场上始终有 3 个靶子，击中一个立刻刷新一个。<br/>30 秒内看看你能打中多少个？</p>
  <div id="final"></div>
  <button id="startBtn">开始游戏</button>
</div>

<script>
(() => {
  const TOTAL_TARGETS = 3;       // 场上同时存在的目标数
  const GAME_SECONDS  = 30;
  const MIN_GAP       = 130;     // 目标之间的最小间距(px)

  const overlay   = document.getElementById('overlay');
  const startBtn  = document.getElementById('startBtn');
  const scoreEl   = document.getElementById('score');
  const timeEl    = document.getElementById('time');
  const rateEl    = document.getElementById('rate');
  const finalEl   = document.getElementById('final');
  const crosshair = document.getElementById('crosshair');

  let score = 0, timeLeft = GAME_SECONDS, playing = false, timerId = null;
  let targets = []; // {el, x, y, size}

  /* ---------- 准星跟随 ---------- */
  document.addEventListener('mousemove', e => {
    crosshair.style.left = e.clientX + 'px';
    crosshair.style.top  = e.clientY + 'px';
  });

  /* ---------- 随机位置（不重叠、避开 HUD） ---------- */
  function randomPos(size) {
    const topSafe = 110;                 // 避开顶部 HUD
    const pad = size / 2 + 12;
    for (let i = 0; i < 60; i++) {
      const x = pad + Math.random() * (window.innerWidth  - pad * 2);
      const y = topSafe + pad + Math.random() * (window.innerHeight - topSafe - pad * 2);
      const ok = targets.every(t => Math.hypot(t.x - x, t.y - y) > MIN_GAP + (t.size + size) / 4);
      if (ok) return { x, y };
    }
    return {
      x: pad + Math.random() * (window.innerWidth  - pad * 2),
      y: topSafe + pad + Math.random() * (window.innerHeight - topSafe - pad * 2)
    };
  }

  /* ---------- 生成一个靶子 ---------- */
  function spawnTarget() {
    const size = 54 + Math.random() * 34; // 54 ~ 88 px
    const { x, y } = randomPos(size);

    const el = document.createElement('div');
    el.className = 'target';
    el.style.width = el.style.height = size + 'px';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.innerHTML = '<div class="ring"></div>';

    const t = { el, x, y, size, dead: false };
    targets.push(t);
    document.body.appendChild(el);

    // 鼠标滑入 = 击中
    el.addEventListener('mouseenter', () => hit(t));
  }

  /* ---------- 击中 ---------- */
  function hit(t) {
    if (!playing || t.dead) return;
    t.dead = true;

    score++;
    scoreEl.textContent = score;
    crosshair.classList.add('hot');
    setTimeout(() => crosshair.classList.remove('hot'), 90);

    // 火花 + 飘分
    for (let i = 0; i < 7; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      const ang = Math.random() * Math.PI * 2, d = 30 + Math.random() * 40;
      s.style.setProperty('--dx', Math.cos(ang) * d + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * d + 'px');
      s.style.left = t.x + 'px'; s.style.top = t.y + 'px';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 420);
    }
    const pop = document.createElement('div');
    pop.className = 'score-pop';
    pop.textContent = '+1';
    pop.style.left = t.x + 'px'; pop.style.top = (t.y - t.size / 2) + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 520);

    // 目标消失 → 随机补一个新的
    t.el.classList.add('hit');
    setTimeout(() => t.el.remove(), 230);
    targets = targets.filter(v => v !== t);
    if (playing) spawnTarget();
  }

  /* ---------- 游戏流程 ---------- */
  function startGame() {
    score = 0; timeLeft = GAME_SECONDS; playing = true;
    scoreEl.textContent = '0';
    timeEl.textContent = timeLeft;
    timeEl.classList.remove('low');
    rateEl.textContent = '0.0';
    overlay.classList.add('hidden');

    targets.forEach(t => t.el.remove());
    targets = [];
    for (let i = 0; i < TOTAL_TARGETS; i++) spawnTarget();

    clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      rateEl.textContent = (score / (GAME_SECONDS - timeLeft)).toFixed(1);
      if (timeLeft <= 5) timeEl.classList.add('low');
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    playing = false;
    clearInterval(timerId);
    targets.forEach(t => t.el.remove());
    targets = [];
    finalEl.style.display = 'block';
    finalEl.textContent = `🎉 最终得分：${score} 个（${(score / GAME_SECONDS).toFixed(1)} 个/秒）`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  startBtn.addEventListener('mouseenter', () => { if (!playing) startGame(); });
  startBtn.addEventListener('click', () => { if (!playing) startGame(); });
})();
</script>
</body>
</html>
