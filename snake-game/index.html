<!DOCTYPE html>
<html>
<head>
    <title>贪吃蛇游戏</title>
</head>
<body>
    <canvas id="snake" width="512" height="512"></canvas>

    <script type="text/javascript">
        let canvas = document.getElementById("snake");
        let context = canvas.getContext("2d");
        let box = 32;
        let snake = [];
        snake[0] = {
            x: 8 * box,
            y: 8 * box
        };
        let direction = "right";
        let food = {
            x: genfood(),
            y: genfood()
        };

        function genfood() {
            // 修正随机数逻辑，生成 0~15 之间的整数，再乘以 box
            return Math.floor(Math.random() * 16) * box;
        }

        function drawbg() {
            // 修正 fillStyle 和 fillRect 的拼写/参数
            context.fillStyle = "lightgreen";
            context.fillRect(0, 0, 16 * box, 16 * box);
        }

        function drawsnake() {
            for(i = 0; i < snake.length; i++) {
                context.fillStyle = "green";
                context.fillRect(snake[i].x, snake[i].y, box, box);
            }
        }

        function drawfood() {
            context.fillStyle = "red";
            context.fillRect(food.x, food.y, box, box);
        }

        // 键盘控制方向
        document.addEventListener("keydown", keyevent);
        function keyevent(event) {
            if(event.keyCode === 37 && direction !== 'right') direction = 'left';
            if(event.keyCode === 38 && direction !== 'down') direction = 'up';
            if(event.keyCode === 39 && direction !== 'left') direction = 'right';
            if(event.keyCode === 40 && direction !== 'up') direction = 'down';
        }

        // 游戏循环
        function startgame() {
            // 撞墙判断
            if(snake[0].x < 0 || snake[0].x > 15*box || 
               snake[0].y < 0 || snake[0].y > 15*box) {
                clearInterval(game);
                alert("游戏结束！");
            }

            // 蛇身移动（除了头，后面的身体跟着前面的走）
            for(let i = snake.length - 1; i > 0; i--) {
                snake[i].x = snake[i-1].x;
                snake[i].y = snake[i-1].y;
            }

            // 蛇头移动
            if(direction === "left") snake[0].x -= box;
            if(direction === "up") snake[0].y -= box;
            if(direction === "right") snake[0].x += box;
            if(direction === "down") snake[0].y += box;

            // 吃食物逻辑
            if(snake[0].x === food.x && snake[0].y === food.y) {
                snake.push({}); // 增加一节身体
                food = {x: genfood(), y: genfood()}; // 生成新食物
            }

            drawbg();
            drawsnake();
            drawfood();
        }

        // 每 100ms 刷新一次游戏
        let game = setInterval(startgame, 100);
    </script>
</body>
</html>
