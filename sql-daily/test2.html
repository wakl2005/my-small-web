<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>localStorage测试</title></head>
<body style="font-family:sans-serif;padding:20px;max-width:500px;margin:0 auto">
<h2>localStorage 测试</h2>
<p id="status"></p>
<button onclick="testWrite()" style="padding:10px 20px;margin:5px">写入测试</button>
<button onclick="testRead()" style="padding:10px 20px;margin:5px">读取测试</button>
<button onclick="testClear()" style="padding:10px 20px;margin:5px">清空</button>
<pre id="output" style="background:#f5f5f5;padding:15px;border-radius:8px;min-height:100px;white-space:pre-wrap"></pre>
<script>
var out=document.getElementById("output");
function msg(m){out.innerHTML=m;}
function testWrite(){
  try{
    localStorage.setItem("test_key","hello_world");
    msg("写入成功！\n\nlocalStorage.test_key = "+localStorage.getItem("test_key"));
  }catch(e){
    msg("写入失败！\n\n错误："+e.message);
  }
}
function testRead(){
  try{
    var v=localStorage.getItem("test_key");
    msg("读取结果：\n\ntest_key = "+(v===null?"(不存在)":v)+"\n\n所有key："+JSON.stringify(Object.keys(localStorage)));
  }catch(e){
    msg("读取失败！\n\n错误："+e.message);
  }
}
function testClear(){
  localStorage.removeItem("test_key");
  msg("已清空 test_key");
}
msg("点击按钮开始测试");
</script>
</body>
</html>
