<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日 SQL 一练</title>
<style>
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#0f0f23;color:#eaeaea;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
header{text-align:center;margin:30px 0 20px}
h1{font-size:2rem;background:linear-gradient(135deg,#e94560,#ff6b8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
#dt{color:#888;font-size:.95rem}
.stats{display:flex;gap:30px;margin:20px 0;padding:16px 28px;background:#1a1a2e;border-radius:12px;border:1px solid #2a2a4a}
.stat-box{text-align:center}
.stat-box .val{font-size:1.5rem;font-weight:700;color:#e94560}
.stat-box .lbl{font-size:.75rem;color:#888;margin-top:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:820px;width:100%;margin:20px 0}
.card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:16px;padding:24px 20px;position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:all .3s}
.card:hover{transform:translateY(-4px);border-color:#e94560}
.card .num{font-size:.75rem;color:#e94560;font-weight:700;margin-bottom:10px}
.card h3{font-size:1rem;line-height:1.5;margin-bottom:14px}
.card .meta{display:flex;gap:10px;font-size:.78rem;color:#888;flex-wrap:wrap}
.tag{background:#0f3460;padding:3px 10px;border-radius:20px;color:#60a5fa;font-size:.72rem}
.actions{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 24px;border:1px solid #2a2a4a;border-radius:8px;background:#1a1a2e;color:#eaeaea;font-size:.9rem;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#e94560;color:#e94560}
.btn-red{background:#e94560;border-color:#e94560;color:#fff}
.btn-red:hover{background:#c81e45;border-color:#c81e45}
.tip{margin-top:20px;padding:12px 20px;background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.3);border-radius:8px;font-size:.8rem;color:#888;max-width:600px;text-align:center}
#addForm{display:none;max-width:600px;width:100%;margin:30px 0;padding:24px;background:#1a1a2e;border-radius:16px;border:1px solid #2a2a4a}
#addForm.show{display:block}
#addForm h3{margin-bottom:16px;color:#e94560}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:.85rem;color:#888;margin-bottom:6px}
.form-row input,.form-row select{width:100%;padding:10px 14px;background:#0f0f23;border:1px solid #2a2a4a;border-radius:8px;color:#eaeaea;font-size:.9rem;box-sizing:border-box}
.form-row input:focus{border-color:#e94560;outline:none}
</style>
</head>
<body>
<header>
<h1>每日 SQL 一练</h1>
<div id="dt"></div>
</header>
<div class="stats">
<div class="stat-box"><div class="val" id="totalCount">0</div><div class="lbl">已收录</div></div>
<div class="stat-box"><div class="val" id="reviewCount">0</div><div class="lbl">已复习</div></div>
</div>
<div class="cards" id="cardBox"></div>
<div class="actions">
<button class="btn btn-red" onclick="reshuffle()">换一换</button>
<button class="btn" onclick="markDone()">标记已做</button>
<button class="btn" onclick="toggleAdd()">添加题目</button>
<button class="btn" onclick="clearAll()">清空题库</button>
</div>
<div id="addForm">
<h3>添加新题目</h3>
<div class="form-row"><label>题目名称</label><input id="inputTitle" placeholder="例：查找所有学生的姓名和年龄"></div>
<div class="form-row"><label>难度</label><select id="inputDiff"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></div>
<div class="form-row"><label>链接（可选）</label><input id="inputLink" placeholder="https://..."></div>
<div class="form-row"><label>标签（可选）</label><input id="inputTag" placeholder="例：子查询"></div>
<div style="display:flex;gap:10px;margin-top:16px">
<button class="btn btn-red" onclick="saveQuestion()">保存</button>
<button class="btn" onclick="toggleAdd()">取消</button>
</div>
</div>
<div class="tip">每天随机抽2题，数据保存在浏览器中</div>

<script>
var questions = [];

var reviewedSet = new Set();

function loadData() {
  var ver = localStorage.getItem("sq_ver");
  if (ver !== "v2") {
    localStorage.clear();
    localStorage.setItem("sq_ver", "v2");
  }
  questions = [];
  reviewedSet = new Set();
}

function saveData() {
  localStorage.setItem("sq", JSON.stringify(questions));
}

function getDaySeed() {
  var d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function seededRandom(seed) {
  var s = seed;
  return function() {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  }
}

function getDailyQuestions(count) {
  var rand = seededRandom(getDaySeed());
  var shuffled = questions.slice();
  for (var i = shuffled.length - 1; i > 0; i--) {
    var j = Math.floor(rand() * (i + 1));
    var tmp = shuffled[i];
    shuffled[i] = shuffled[j];
    shuffled[j] = tmp;
  }
  return shuffled.slice(0, Math.min(count, questions.length));
}

function diffText(d) { return d === "easy" ? "简单" : d === "medium" ? "中等" : "困难"; }
function diffClass(d) { return d === "easy" ? "de" : d === "medium" ? "dm" : "dh"; }

function render() {
  var now = new Date();
  document.getElementById("dt").textContent = now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日";
  document.getElementById("totalCount").textContent = questions.length;
  document.getElementById("reviewCount").textContent = reviewedSet.size;

  var daily = getDailyQuestions(2);
  var box = document.getElementById("cardBox");
  box.innerHTML = "";

  for (var i = 0; i < daily.length; i++) {
    var q = daily[i];
    var hasLink = q.link && q.link.indexOf("http") === 0;
    var el;
    if (hasLink) {
      el = document.createElement("a");
      el.href = q.link;
      el.target = "_blank";
      el.rel = "noopener";
    } else {
      el = document.createElement("div");
    }
    el.className = "card";
    el.innerHTML = '<div class="num">今日第' + (i+1) + '题</div><h3>' + q.title + '</h3><div class="meta"><span class="tag">' + (q.tag||"") + '</span><span class="tag ' + diffClass(q.diff) + '">' + diffText(q.diff) + '</span></div>';
    box.appendChild(el);
  }
}

function reshuffle() {
  var rand = seededRandom(getDaySeed() + new Date().getSeconds());
  var shuffled = questions.slice();
  for (var i = shuffled.length - 1; i > 0; i--) {
    var j = Math.floor(rand() * (i + 1));
    var tmp = shuffled[i];
    shuffled[i] = shuffled[j];
    shuffled[j] = tmp;
  }
  var daily = shuffled.slice(0, 2);
  var box = document.getElementById("cardBox");
  box.innerHTML = "";
  for (var i = 0; i < daily.length; i++) {
    var q = daily[i];
    var hasLink = q.link && q.link.indexOf("http") === 0;
    var el;
    if (hasLink) {
      el = document.createElement("a");
      el.href = q.link;
      el.target = "_blank";
      el.rel = "noopener";
    } else {
      el = document.createElement("div");
    }
    el.className = "card";
    el.innerHTML = '<div class="num">今日第' + (i+1) + '题</div><h3>' + q.title + '</h3><div class="meta"><span class="tag">' + (q.tag||"") + '</span><span class="tag ' + diffClass(q.diff) + '">' + diffText(q.diff) + '</span></div>';
    box.appendChild(el);
  }
}

function clearAll() {
  if(confirm("确定清空所有题目吗？此操作不可恢复！")) {
    questions = [];
    reviewedSet = new Set();
    localStorage.removeItem("sq");
    localStorage.removeItem("sqr");
    render();
    alert("题库已清空");
  }
}

function markDone() {
  reviewedSet.add(getDaySeed());
  alert("已标记今日已做");
}

function toggleAdd() {
  var form = document.getElementById("addForm");
  if (form.className.indexOf("show") >= 0) {
    form.className = form.className.replace(" show", "").replace("show", "");
  } else {
    form.className = form.className + " show";
  }
}

function saveQuestion() {
  var title = document.getElementById("inputTitle").value.trim();
  var diff = document.getElementById("inputDiff").value;
  var link = document.getElementById("inputLink").value.trim();
  var tag = document.getElementById("inputTag").value.trim();
  if (!title) { alert("请填写题目名称"); return; }
  questions.push({title:title, diff:diff, tag:tag, link:link});
  saveData();
  document.getElementById("inputTitle").value = "";
  document.getElementById("inputLink").value = "";
  document.getElementById("inputTag").value = "";
  render();
  alert("添加成功");
}

loadData();
render();
</script>
</body>
</html>
