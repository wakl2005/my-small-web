<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日 SQL 一练</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f23;--card:#1a1a2e;--accent:#e94560;--accent2:#0f3460;--txt:#eaeaea;--dim:#888;--ok:#4ade80;--brd:#2a2a4a;--warn:#f59e0b}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
header{text-align:center;margin:30px 0 20px}
header h1{font-size:2rem;background:linear-gradient(135deg,var(--accent),#ff6b8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
#dt{color:var(--dim);font-size:.95rem}
.stats{display:flex;gap:30px;margin:20px 0;padding:16px 28px;background:var(--card);border-radius:12px;border:1px solid var(--brd);flex-wrap:wrap;justify-content:center}
.sn{font-size:1.5rem;font-weight:700;color:var(--accent)}
.sl{font-size:.75rem;color:var(--dim);margin-top:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:820px;width:100%;margin:20px 0}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:24px 20px;position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:all .3s}
.card:hover{transform:translateY(-4px);border-color:#e94560}
.card .num{font-size:.75rem;color:#e94560;font-weight:700;margin-bottom:10px}
.card h3{font-size:1rem;line-height:1.5;margin-bottom:14px}
.card .meta{display:flex;gap:10px;font-size:.78rem;color:var(--dim);flex-wrap:wrap}
.tag{background:#0f3460;padding:3px 10px;border-radius:20px;color:#60a5fa;font-size:.72rem}
.df{padding:3px 10px;border-radius:20px;font-size:.72rem}
.de{background:rgba(74,222,128,.15);color:#4ade80}
.dm{background:rgba(245,158,11,.15);color:#f59e0b}
.dh{background:rgba(233,69,96,.15);color:#e94560}
.card .arrow{position:absolute;right:18px;bottom:18px;font-size:1.4rem;color:#e94560;opacity:0;transition:all .3s}
.card:hover .arrow{opacity:1;transform:translateX(4px)}
.actions{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 24px;border:1px solid #2a2a4a;border-radius:8px;background:#1a1a2e;color:#eaeaea;font-size:.9rem;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#e94560;color:#e94560}
.bp{background:#e94560;border-color:#e94560;color:#fff}
.bp:hover{background:#c81e45;border-color:#c81e45}
.tip{margin-top:20px;padding:12px 20px;background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.3);border-radius:8px;font-size:.8rem;color:#888;max-width:600px;text-align:center}
.panel{display:none;max-width:600px;width:100%;margin:30px 0;padding:24px;background:#1a1a2e;border-radius:16px;border:1px solid #2a2a4a}
.panel.show{display:block}
.panel h3{margin-bottom:16px;color:#e94560}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.85rem;color:#888;margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;background:#0f0f23;border:1px solid #2a2a4a;border-radius:8px;color:#eaeaea;font-size:.9rem;box-sizing:border-box}
.fg textarea{min-height:100px;resize:vertical;font-family:inherit}
.fg small{color:#888;font-size:.75rem;margin-top:4px;display:block}
.mi{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:8px;margin-bottom:6px}
.mi .t{font-size:.85rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.mi .d{padding:3px 10px;background:rgba(233,69,96,.2);border:1px solid #e94560;border-radius:6px;color:#e94560;cursor:pointer;font-size:.75rem}
.hint-box{max-width:600px;width:100%;margin:10px 0;padding:16px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:8px;font-size:.85rem;color:#f59e0b;line-height:1.6}
@media(max-width:600px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>每日 SQL 一练</h1>
<div id="dt"></div>
</header>
<div class="stats">
<div style="text-align:center"><div class="sn" id="tC">0</div><div class="sl">已收录</div></div>
</div>
<div class="cards" id="cC"></div>

<div class="hint-box">
<strong>📌 使用提示：</strong><br>
1. 点击「➕ 添加题目」输入题目信息<br>
2. 点击「📤 导出题库」下载题库文件保存到电脑<br>
3. 下次打开页面点击「📥 导入题库」恢复题目<br>
4. 题库可以手动编辑JSON文件批量添加
</div>

<div class="actions">
<button class="btn" onclick="toggleAdd()">➕ 添加题目</button>
<button class="btn" onclick="reshuffle()">🎲 换一换</button>
<button class="btn bp" onclick="exportData()">📤 导出题库</button>
<button class="btn" onclick="importData()">📥 导入题库</button>
<button class="btn" onclick="toggleMgr()">🗂️ 管理题目</button>
</div>

<div class="panel" id="panelAdd">
<h3>➕ 添加新题目</h3>
<div class="fg"><label>题目名称 *</label><input id="iT" placeholder="例：查找所有学生的姓名和年龄"></div>
<div class="fg"><label>难度</label><select id="iD"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></div>
<div class="fg"><label>来源链接（可选，有链接可点击跳转）</label><input id="iL" placeholder="https://www.nowcoder.com/practice/..."></div>
<div class="fg"><label>知识点标签（可选）</label><input id="iG" placeholder="例：子查询、JOIN、窗口函数"></div>
<div style="display:flex;gap:10px;margin-top:16px"><button class="btn bp" onclick="saveQ()">保存</button><button class="btn" onclick="toggleAdd()">取消</button></div>
</div>

<div class="panel" id="panelMgr">
<h3 style="margin-bottom:16px">🗂️ 题目管理 (<span id="mC">0</span>题)</h3>
<div id="mL"></div>
</div>

<div class="tip">💡 每天随机2题 · 导出题库保存到电脑 · 导入题库恢复数据</div>

<script>
var Q = [
  {"title":"各个视频的平均完播率","diff":"easy","link":"https://www.nowcoder.com/practice/96263162f69a48df9d84a93c71045753?tpId=268&tqId=2285032","tag":""},
  {"title":"平均播放进度大于60%的视频类别","diff":"easy","link":"https://www.nowcoder.com/practice/c60242566ad94bc29959de0cdc6d95ef?tpId=268&tqId=2285039","tag":""},
  {"title":"每类视频近一个月的转发量/率","diff":"medium","link":"https://www.nowcoder.com/practice/a78cf92c11e0421abf93762d25c3bfad?tpId=268&tqId=2285068","tag":""},
  {"title":"每个创作者每月的涨粉率及截止当前的总粉丝量","diff":"medium","link":"https://www.nowcoder.com/practice/d337c95650f640cca29c85201aecff84?tpId=268&tqId=2285069","tag":""},
  {"title":"国庆期间每类视频点赞量和转发量","diff":"hard","link":"https://www.nowcoder.com/practice/f90ce4ee521f400db741486209914a11?tpId=268&tqId=2285070","tag":""},
  {"title":"近一个月发布的视频中热度最高的top3视频","diff":"hard","link":"https://www.nowcoder.com/practice/0226c7b2541c41e59c3b8aec588b09ff?tpId=268&tqId=2285071","tag":""},
  {"title":"2021年11月每天的人均浏览文章时长","diff":"easy","link":"https://www.nowcoder.com/practice/8e33da493a704d3da15432e4a0b61bb3?tpId=268&tqId=2285342","tag":""},
  {"title":"每篇文章同一时刻最大在看人数","diff":"medium","link":"https://www.nowcoder.com/practice/fe24c93008b84e9592b35faa15755e48?tpId=268&tqId=2285343","tag":""},
  {"title":"2021年11月每天新用户的次日留存率","diff":"medium","link":"https://www.nowcoder.com/practice/1fc0e75f07434ef5ba4f1fb2aa83a450?tpId=268&tqId=2285344","tag":""},
  {"title":"统计活跃间隔对用户分级结果","diff":"hard","link":"https://www.nowcoder.com/practice/6765b4a4f260455bae513a60b6eed0af?tpId=268&tqId=2285345","tag":""},
  {"title":"每天的日活数及新用户占比","diff":"hard","link":"https://www.nowcoder.com/practice/dbbc9b03794a48f6b34f1131b1a903eb?tpId=268&tqId=2285346","tag":""},
  {"title":"连续签到领金币","diff":"hard","link":"https://www.nowcoder.com/practice/aef5adcef574468c82659e8911bb297f?tpId=268&tqId=2285347","tag":""},
  {"title":"计算商城中2021年每月的GMV","diff":"easy","link":"https://www.nowcoder.com/practice/5005cbf5308249eda1fbf666311753bf?tpId=268&tqId=2285515","tag":""},
  {"title":"统计2021年10月每个退货率不大于0.5的商品各项指标","diff":"medium","link":"https://www.nowcoder.com/practice/cbf582d28b794722becfc680847327be?tpId=268&tqId=2285516","tag":""},
  {"title":"某店铺的各商品毛利率及店铺整体毛利率","diff":"medium","link":"https://www.nowcoder.com/practice/65de67f666414c0e8f9a34c08d4a8ba6?tpId=268","tag":""},
  {"title":"零食类商品中复购率top3高的商品","diff":"medium","link":"https://www.nowcoder.com/practice/9c175775e7ad4d9da41602d588c5caf3?tpId=268","tag":""},
  {"title":"10月的新户客单价和获客成本","diff":"hard","link":"https://www.nowcoder.com/practice/d15ee0798e884f829ae8bd27e10f0d64?tpId=268","tag":""},
  {"title":"店铺901国庆期间的7日动销率和滞销率","diff":"hard","link":"https://www.nowcoder.com/practice/e7837f66e8fb4d45b694d24ea61f0dc9?tpId=268","tag":""},
  {"title":"2021年国庆在北京接单3次及以上的司机统计信息","diff":"easy","link":"https://www.nowcoder.com/practice/992783fd80f746d49e790d33ee537c19?tpId=268","tag":""},
  {"title":"有取消订单记录的司机平均评分","diff":"easy","link":"https://www.nowcoder.com/practice/f022c9ec81044d4bb7e0711ab794531a?tpId=268","tag":""},
  {"title":"每个城市中评分最高的司机信息","diff":"medium","link":"https://www.nowcoder.com/practice/dcc4adafd0fe41b5b2fc03ad6a4ac686?tpId=268","tag":""},
  {"title":"国庆期间近7日日均取消订单量","diff":"medium","link":"https://www.nowcoder.com/practice/2b330aa6cc994ec2a988704a078a0703?tpId=268","tag":""},
  {"title":"工作日各时段叫车量、等待接单时间和调度时间","diff":"hard","link":"https://www.nowcoder.com/practice/34f88f6d6dc549f6bc732eb2128aa338?tpId=268","tag":""},
  {"title":"各城市最大同时等车人数","diff":"hard","link":"https://www.nowcoder.com/practice/f301eccab83c42ab8dab80f28a1eef98?tpId=268","tag":""},
  {"title":"某宝店铺的SPU数量","diff":"easy","link":"https://www.nowcoder.com/practice/2b6ea6b8fe634d2cbc39be46db411ca4?tpId=268","tag":""},
  {"title":"某宝店铺的实际销售额与客单价","diff":"easy","link":"https://www.nowcoder.com/practice/b3a0731dfd654361943916d8d85699cd?tpId=268","tag":""},
  {"title":"某宝店铺折扣率","diff":"medium","link":"https://www.nowcoder.com/practice/3a56f160308441f5a79d8ac8d953e5e7?tpId=268","tag":""},
  {"title":"某宝店铺动销率与售罄率","diff":"hard","link":"https://www.nowcoder.com/practice/715dd44c994f45cb871afa98f1b77538?tpId=268","tag":""},
  {"title":"某宝店铺连续2天及以上购物的用户及其对应的天数","diff":"hard","link":"https://www.nowcoder.com/practice/63ac3be0e4b44cce8dd2619d2236c3bf?tpId=268","tag":""},
  {"title":"牛客直播转换率","diff":"easy","link":"https://www.nowcoder.com/practice/73bf143cfc7f452a8569c6d7eca380f9?tpId=268","tag":""},
  {"title":"牛客直播开始时各直播间在线人数","diff":"medium","link":"https://www.nowcoder.com/practice/bdd30e83d47043c99def6d9671bb6dbf?tpId=268","tag":""},
  {"title":"牛客直播各科目平均观看时长","diff":"medium","link":"https://www.nowcoder.com/practice/e9e7dc4c8623467793f6999cbfee9360?tpId=268","tag":""},
  {"title":"牛客直播各科目出勤率","diff":"hard","link":"https://www.nowcoder.com/practice/0cab547df4f0430b93042128f445d899?tpId=268","tag":""},
  {"title":"牛客直播各科目同时在线人数","diff":"hard","link":"https://www.nowcoder.com/practice/d69677e41f9a4bf3b3ed7a42573e9490?tpId=268","tag":""},
  {"title":"某乎问答11月份日人均回答量","diff":"easy","link":"https://www.nowcoder.com/practice/d1f5a1e50d0b49f3a39eb01c4fdb621f?tpId=268","tag":""},
  {"title":"某乎问答高质量的回答中用户属于各级别的数量","diff":"medium","link":"https://www.nowcoder.com/practice/69c85db3e59245efb7cee51996fe2273?tpId=268","tag":""},
  {"title":"某乎问答单日回答问题数大于等于3个的所有用户","diff":"medium","link":"https://www.nowcoder.com/practice/821e5072663f485f8204cf03b89d322a?tpId=268","tag":""},
  {"title":"某乎问答回答过教育类问题的用户里有多少用户回答过职场类问题","diff":"medium","link":"https://www.nowcoder.com/practice/b02cf9ee7b9f4cdda308f8155ff3415d?tpId=268","tag":""},
  {"title":"某乎问答最大连续回答问题天数大于等于3天的用户及其对应等级","diff":"hard","link":"https://www.nowcoder.com/practice/e080f8a685bc4af3b47749ca3310f1fd?tpId=268","tag":""}
];

function getDaySeed(){
  var d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function seededRand(seed){
  var s=seed;
  return function(){s=(s*9301+49297)%233280;return s/233280;}
}
function getDaily(n){
  var r=seededRand(getDaySeed()), s=Q.slice();
  for(var i=s.length-1;i>0;i--){
    var j=Math.floor(r()*(i+1));
    var t=s[i];s[i]=s[j];s[j]=t;
  }
  return s.slice(0,Math.min(n,Q.length));
}
function dc(d){return d==='easy'?'简单':d==='medium'?'中等':'困难';}
function dk(d){return d==='easy'?'de':d==='medium'?'dm':'dh';}
function validL(l){return l&&l.indexOf('http')===0;}

function render(){
  var n=new Date();
  document.getElementById('dt').innerHTML=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';
  document.getElementById('tC').innerHTML=Q.length;
  var daily=getDaily(2);
  var c=document.getElementById('cC');
  c.innerHTML='';
  if(!daily.length){
    c.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888">题库为空，点击「📥 导入题库」或「➕ 添加题目」开始</div>';
    return;
  }
  for(var i=0;i<daily.length;i++){
    var q=daily[i], hl=validL(q.link);
    var a=document.createElement(hl?'a':'div');
    a.className='card';
    if(hl){a.href=q.link;a.target='_blank';a.rel='noopener';}
    a.innerHTML='<div class="num">今日第'+(i+1)+'题</div><h3>'+q.title+'</h3><div class="meta"><span class="tag">'+(q.tag||'')+'</span><span class="df '+dk(q.diff)+'">'+dc(q.diff)+'</span></div><div class="arrow">'+(hl?'→':'•')+'</div>';
    c.appendChild(a);
  }
}

function toggleAdd(){
  var p=document.getElementById('panelAdd');
  p.classList.toggle('show');
  document.getElementById('panelMgr').classList.remove('show');
}

function toggleMgr(){
  var p=document.getElementById('panelMgr');
  p.classList.toggle('show');
  document.getElementById('panelAdd').classList.remove('show');
  if(p.classList.contains('show'))renderMgr();
}

function saveQ(){
  var t=document.getElementById('iT').value.trim();
  var d=document.getElementById('iD').value;
  var l=document.getElementById('iL').value.trim();
  var g=document.getElementById('iG').value.trim();
  if(!t){alert('请填写题目名称');return;}
  Q.push({title:t,diff:d,link:l,tag:g});
  document.getElementById('iT').value='';
  document.getElementById('iL').value='';
  document.getElementById('iG').value='';
  render();
  alert('✅ 添加成功！记得点击「📤 导出题库」保存哦');
}

function renderMgr(){
  document.getElementById('mC').textContent=Q.length;
  var l=document.getElementById('mL');
  l.innerHTML='';
  if(!Q.length){l.innerHTML='<div style="text-align:center;padding:15px;color:#888">暂无题目</div>';return;}
  for(var i=0;i<Q.length;i++){
    var d=document.createElement('div');
    d.className='mi';
    d.innerHTML='<div class="t">'+(i+1)+'. '+Q[i].title+' ('+dc(Q[i].diff)+')</div><button class="d" onclick="delQ('+i+')">删除</button>';
    l.appendChild(d);
  }
}

function delQ(i){
  if(confirm('删除第'+(i+1)+'题？')){
    Q.splice(i,1);render();renderMgr();
  }
}

function reshuffle(){
  var r=seededRand(getDaySeed()+new Date().getSeconds());
  var s=Q.slice();
  for(var i=s.length-1;i>0;i--){
    var j=Math.floor(r()*(i+1));
    var t=s[i];s[i]=s[j];s[j]=t;
  }
  var daily=s.slice(0,2);
  var c=document.getElementById('cC');c.innerHTML='';
  for(var i=0;i<daily.length;i++){
    var q=daily[i], hl=validL(q.link);
    var a=document.createElement(hl?'a':'div');
    a.className='card';
    if(hl){a.href=q.link;a.target='_blank';a.rel='noopener';}
    a.innerHTML='<div class="num">今日第'+(i+1)+'题</div><h3>'+q.title+'</h3><div class="meta"><span class="tag">'+(q.tag||'')+'</span><span class="df '+dk(q.diff)+'">'+dc(q.diff)+'</span></div><div class="arrow">'+(hl?'→':'•')+'</div>';
    c.appendChild(a);
  }
}

function exportData(){
  var data=JSON.stringify(Q,null,2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='sql_questions_'+getDaySeed()+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json';
  inp.onchange=function(e){
    var f=e.target.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(Array.isArray(d)){Q=d;render();alert('✅ 导入成功！共 '+d.length+' 道题');}
        else alert('❌ 文件格式错误');
      }catch(err){alert('❌ 解析失败');}
    };
    r.readAsText(f);
  };
  inp.click();
}

render();
</script>
</body>
</html>
