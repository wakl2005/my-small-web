<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日 SQL 一练</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f23;--card:#1a1a2e;--accent:#e94560;--accent2:#0f3460;--txt:#eaeaea;--dim:#888;--ok:#4ade80;--brd:#2a2a4a;--warn:#f59e0b}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
header{text-align:center;margin:30px 0 20px}
header h1{font-size:2rem;background:linear-gradient(135deg,var(--accent),#ff6b8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
header .date{color:var(--dim);font-size:.95rem}
header .streak{margin-top:10px;font-size:.85rem;color:var(--ok)}
.stats{display:flex;gap:30px;margin:20px 0;padding:16px 28px;background:var(--card);border-radius:12px;border:1px solid var(--brd);flex-wrap:wrap;justify-content:center}
.sn{font-size:1.5rem;font-weight:700;color:var(--accent)}
.sl{font-size:.75rem;color:var(--dim);margin-top:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:820px;width:100%;margin:20px 0}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:24px 20px;transition:all .3s;position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block}
.card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent);transform:scaleY(0);transition:transform .3s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 40px rgba(233,69,96,.15)}
.card:hover::before{transform:scaleY(1)}
.card .num{font-size:.75rem;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:10px}
.card h3{font-size:1rem;line-height:1.5;margin-bottom:14px}
.card .meta{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--dim);flex-wrap:wrap}
.tg{background:var(--accent2);padding:3px 10px;border-radius:20px;color:#60a5fa;font-size:.72rem}
.df{padding:3px 10px;border-radius:20px;font-size:.72rem}
.de{background:rgba(74,222,128,.15);color:var(--ok)}
.dm{background:rgba(245,158,11,.15);color:var(--warn)}
.dh{background:rgba(233,69,96,.15);color:var(--accent)}
.card .arrow{position:absolute;right:18px;bottom:18px;font-size:1.4rem;color:var(--accent);opacity:0;transition:all .3s}
.card:hover .arrow{opacity:1;transform:translateX(4px)}
.actions{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 24px;border:1px solid var(--brd);border-radius:8px;background:var(--card);color:var(--txt);font-size:.9rem;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.bp{background:var(--accent);border-color:var(--accent);color:#fff}
.bp:hover{background:#c81e45;border-color:#c81e45}
.tip{margin-top:20px;padding:12px 20px;background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.3);border-radius:8px;font-size:.8rem;color:var(--dim);max-width:600px;text-align:center}
.ab{max-width:600px;width:100%;margin:30px 0;padding:24px;background:var(--card);border-radius:16px;border:1px solid var(--brd);display:none}
.ab.show{display:block}
.ab h3{margin-bottom:16px;color:var(--accent)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.85rem;color:var(--dim);margin-bottom:6px}
.fg input,.fg select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--brd);border-radius:8px;color:var(--txt);font-size:.9rem;outline:none;transition:border-color .3s}
.fg input:focus{border-color:var(--accent)}
.mgr{max-width:600px;width:100%;margin:20px 0;display:none}
.mgr.show{display:block}
.mi{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--brd);border-radius:10px;margin-bottom:8px}
.mi .t{font-size:.9rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px}
.mi .d{padding:4px 12px;background:rgba(233,69,96,.2);border:1px solid var(--accent);border-radius:6px;color:var(--accent);cursor:pointer;font-size:.8rem;flex-shrink:0}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fu .5s ease forwards}
@media(max-width:600px){.cards{grid-template-columns:1fr}header h1{font-size:1.5rem}.stats{gap:16px;padding:12px 16px}}
</style>
</head>
<body>
<header>
<h1>每日 SQL 一练</h1>
<div class="date" id="dt"></div>
<div class="streak" id="stk"></div>
</header>
<div class="stats">
<div style="text-align:center"><div class="sn" id="tC">0</div><div class="sl">已收录</div></div>
<div style="text-align:center"><div class="sn" id="rC">0</div><div class="sl">已复习</div></div>
<div style="text-align:center"><div class="sn" id="tI">-</div><div class="sl">今日</div></div>
</div>
<div class="cards" id="cC"></div>
<div class="actions">
<button class="btn bp" onclick="reshuffle()">换一换</button>
<button class="btn" onclick="markDone()">标记已做</button>
<button class="btn" onclick="showAdd()">添加题目</button>
<button class="btn" onclick="showMgr()">管理题目</button>
<button class="btn" onclick="exp()">导出</button>
<button class="btn" onclick="imp()">导入</button>
</div>
<div class="ab" id="aB">
<h3>添加新题目</h3>
<div class="fg"><label>题目名称</label><input id="iT" placeholder="例：查找所有学生的姓名和年龄"></div>
<div class="fg"><label>难度</label><select id="iD"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></div>
<div class="fg"><label>来源链接（可选）</label><input id="iL" placeholder="https://..."></div>
<div class="fg"><label>知识点标签（可选）</label><input id="iG" placeholder="例：子查询、JOIN"></div>
<div style="display:flex;gap:10px;margin-top:16px"><button class="btn bp" onclick="addQ()">保存</button><button class="btn" onclick="showAdd()">取消</button></div>
</div>
<div class="mgr" id="mB">
<h3 style="margin-bottom:16px;color:var(--accent)">题目管理 <span id="mC" style="font-size:.85rem;color:var(--dim)"></span></h3>
<div id="mL"></div>
</div>
<div class="tip">每天根据日期随机抽10题。点击「添加题目」随时扩充题库，数据保存在浏览器中。</div>
<script>
const D=[{t:"查找所有actor_id为10或20的行的first_name和last_name",d:"easy",g:"基础查询",l:"https://www.nowcoder.com/practice/f2ea9ccf4fb340eeba5c4010418778e7"},{t:"使用子查询找出属于Action分类的所有电影title,description",d:"medium",g:"子查询",l:"https://www.nowcoder.com/practice/2f2e556d335d469f96b91b212c4c203e"},{t:"每个顾客最近一次下单的订单信息",d:"medium",g:"窗口函数",l:"https://www.nowcoder.com/practice/4762ea22b0eb42ceb4f0a972c56d24c4"},{t:"SQL语句分类:检索数据应该使用什么语句",d:"easy",g:"基础语法",l:"https://www.nowcoder.com/practice/6e35c3373e6946d0b1ad3a5e674e8e76"},{t:"计算每个用户平均订单金额并筛选大于100的用户",d:"medium",g:"聚合函数",l:"#"},{t:"查找连续登录7天及以上的用户",d:"hard",g:"连续问题",l:"#"},{t:"删除重复记录只保留ID最小的那条",d:"medium",g:"去重",l:"#"},{t:"将行数据转为列数据(行转列)",d:"hard",g:"CASE WHEN",l:"#"},{t:"计算各部门工资排名前3的员工",d:"hard",g:"窗口函数",l:"#"},{t:"查找没有订单的客户",d:"easy",g:"LEFT JOIN",l:"#"},{t:"计算每月销售额同比增长率",d:"hard",g:"窗口函数",l:"#"},{t:"查找每个类别中价格最高的商品",d:"medium",g:"子查询",l:"#"},{t:"将两个表的数据合并并去重",d:"easy",g:"UNION",l:"#"},{t:"计算用户第7日留存率",d:"hard",g:"留存分析",l:"#"},{t:"查找工资超过部门平均工资的员工",d:"medium",g:"子查询",l:"#"},{t:"将日期格式统一为YYYY-MM-DD",d:"easy",g:"日期函数",l:"#"},{t:"查找互为好友的用户对",d:"medium",g:"自连接",l:"#"},{t:"计算累计求和(累计销售额)",d:"medium",g:"窗口函数",l:"#"},{t:"将一个表的列拆分为多行",d:"hard",g:"行拆分",l:"#"},{t:"查找每个学生分数最高的科目",d:"medium",g:"窗口函数",l:"#"},{t:"计算中位数",d:"hard",g:"统计函数",l:"#"},{t:"查找树形结构的层级关系",d:"hard",g:"递归查询",l:"#"},{t:"将字符串按分隔符拆分为多行",d:"medium",g:"字符串函数",l:"#"},{t:"计算近7天滑动窗口平均值",d:"hard",g:"窗口函数",l:"#"},{t:"查找缺失的数字序列",d:"medium",g:"查找缺失",l:"#"},{t:"分页查询第11-20条记录",d:"easy",g:"LIMIT",l:"#"},{t:"计算每个商品销售占比",d:"medium",g:"聚合函数",l:"#"},{t:"查找连续N天增长的数据",d:"hard",g:"连续问题",l:"#"},{t:"将JSON字段解析为表格",d:"medium",g:"JSON函数",l:"#"},{t:"计算漏斗转化率",d:"hard",g:"漏斗分析",l:"#"},{t:"查找每个团队的成员数量",d:"easy",g:"GROUP BY",l:"#"},{t:"将时间戳转换为可读格式",d:"easy",g:"日期函数",l:"#"},{t:"计算用户RFM模型指标",d:"hard",g:"用户分析",l:"#"},{t:"查找重复的电子邮箱",d:"easy",g:"GROUP BY",l:"#"},{t:"交换性别字段值(f变m,m变f)",d:"easy",g:"UPDATE",l:"#"},{t:"计算每个国家GDP排名",d:"medium",g:"排名函数",l:"#"},{t:"将多行合并为一行(字符串聚合)",d:"medium",g:"GROUP_CONCAT",l:"#"},{t:"查找温度比前一天高的日期",d:"medium",g:"自连接",l:"#"},{t:"查找最大连续登录天数",d:"hard",g:"连续问题",l:"#"},{t:"将宽表转为长表(unpivot)",d:"medium",g:"行列转换",l:"#"},{t:"计算同比和环比增长率",d:"medium",g:"日期计算",l:"#"}];let Q=[],R=new Set();function ld(){const s=localStorage.getItem("sq"),r=localStorage.getItem("sqr");Q=s?JSON.parse(s):[...D];R=r?new Set(JSON.parse(r)):new Set()}function sv(){localStorage.setItem("sq",JSON.stringify(Q));localStorage.setItem("sqr",JSON.stringify([...R]))}function td(){const n=new Date();return n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate()}function sd(s){let v=s;return()=>{v=(v*9301+49297)%233280;return v/233280}}function dq(c){const r=sd(td()),s=[...Q];for(let i=s.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[s[i],s[j]]=[s[j],s[i]]}return s.slice(0,Math.min(c||10,Q.length))}function dc(d){return d==="easy"?"简单":d==="medium"?"中等":"困难"}function dk(d){return d==="easy"?"de":d==="medium"?"dm":"dh"}function render(){const n=new Date();document.getElementById("dt").textContent=n.getFullYear()+"年"+(n.getMonth()+1)+"月"+n.getDate()+"日";document.getElementById("tC").textContent=Q.length;document.getElementById("rC").textContent=R.size;const daily=dq(2);document.getElementById("tI").textContent=daily.length+"题";const c=document.getElementById("cC");c.innerHTML="";if(!daily.length){c.innerHTML="<div style=\"grid-column:1/-1;text-align:center;padding:40px;color:var(--dim)\">暂无题目，点击添加题目开始</div>";return}daily.forEach((q,i)=>{const a=document.createElement("a");a.className="card";a.href=q.l||"#";a.target=q.l&&q.l!=="#"?"_blank":"_self";a.style.animationDelay=(i*.05)+"s";a.innerHTML="<div class=\"num\">今日第"+(i+1)+"题</div><h3>"+q.t+"</h3><div class=\"meta\"><span class=\"tg\">"+(q.g||"")+"</span><span class=\"df "+dk(q.d)+"\">"+dc(q.d)+"</span></div><div class=\"arrow\">"+(q.l&&q.l!=="#"?"→":"•")+"</div>";c.appendChild(a)});updStreak()}function updStreak(){const t=new Date();let s=0;for(let i=0;i<365;i++){const d=new Date(t);d.setDate(d.getDate()-i);const k="sd_"+d.getFullYear()+"_"+(d.getMonth()+1)+"_"+d.getDate();if(localStorage.getItem(k))s++;else if(i>0)break}document.getElementById("stk").textContent=s>0?"连续学习 "+s+" 天":"今天开始练习吧！"}function reshuffle(){const r=sd(td()+new Date().getSeconds()),s=[...Q];for(let i=s.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[s[i],s[j]]=[s[j],s[i]]}const daily=s.slice(0,2);const c=document.getElementById("cC");c.innerHTML="";daily.forEach((q,i)=>{const a=document.createElement("a");a.className="card";a.href=q.l||"#";a.target=q.l&&q.l!=="#"?"_blank":"_self";a.style.animationDelay=(i*.05)+"s";a.innerHTML="<div class=\"num\">今日第"+(i+1)+"题</div><h3>"+q.t+"</h3><div class=\"meta\"><span class=\"tg\">"+(q.g||"")+"</span><span class=\"df "+dk(q.d)+"\">"+dc(q.d)+"</span></div><div class=\"arrow\">"+(q.l&&q.l!=="#"?"→":"•")+"</div>";c.appendChild(a)})}function markDone(){const t=new Date();localStorage.setItem("sd_"+t.getFullYear()+"_"+(t.getMonth()+1)+"_"+t.getDate(),"1");R.add(td());sv();updStreak();alert("已标记今日已做")}function showAdd(){document.getElementById("aB").classList.toggle("show");document.getElementById("mB").classList.remove("show")}function showMgr(){const e=document.getElementById("mB");e.classList.toggle("show");document.getElementById("aB").classList.remove("show");if(e.classList.contains("show"))renderMgr()}function addQ(){const t=document.getElementById("iT").value.trim(),d=document.getElementById("iD").value,l=document.getElementById("iL").value.trim(),g=document.getElementById("iG").value.trim();if(!t){alert("请填写题目名称");return}Q.push({t,d,l:l||"#",g});sv();document.getElementById("iT").value="";document.getElementById("iL").value="";document.getElementById("iG").value="";render();alert("添加成功")}function renderMgr(){document.getElementById("mC").textContent="("+Q.length+"题)";const l=document.getElementById("mL");l.innerHTML="";Q.forEach((q,i)=>{const d=document.createElement("div");d.className="mi";d.innerHTML="<div class=\"t\"><strong>"+(i+1)+". "+q.t+"</strong> <span style=\"color:var(--dim);font-size:.8rem\">("+dc(q.d)+")</span></div><button class=\"d\" onclick=\"delQ("+i+")\">删除</button>";l.appendChild(d)})}function delQ(i){if(confirm("确定删除第"+(i+1)+"题吗？")){Q.splice(i,1);sv();render();renderMgr()}}function exp(){const b=new Blob([JSON.stringify(Q,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="sql_questions.json";a.click();URL.revokeObjectURL(u)}function imp(){const inp=document.createElement("input");inp.type="file";inp.accept=".json";inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){Q=d;sv();render();alert("导入 "+d.length+" 题")}else alert("格式错误")}catch(err){alert("解析失败")}};r.readAsText(f)};inp.click()}ld();render();
</script>
</body>
</html>
