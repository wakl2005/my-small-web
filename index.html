<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文学常识每日一练</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card-hover: #222240;
    --accent: #e94560;
    --accent2: #0f3460;
    --gold: #f5c518;
    --text: #e8e8e8;
    --text-dim: #9a9ab0;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --border: #2a2a4a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 32px 0 24px;
    position: relative;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold), #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .header .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 8px;
  }
  .header .date-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 16px;
    background: var(--accent2);
    border-radius: 20px;
    font-size: 13px;
    color: var(--gold);
  }

  /* Progress */
  .progress-bar-wrap {
    background: var(--border);
    border-radius: 10px;
    height: 8px;
    margin: 16px 0 24px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 10px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Stats Row */
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 24px;
  }
  .stat-item {
    text-align: center;
  }
  .stat-num {
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* Question Card */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--accent);
    border-radius: 4px 0 0 4px;
    transition: background 0.3s;
  }
  .question-card.correct::before { background: var(--correct); }
  .question-card.wrong::before { background: var(--wrong); }
  .question-card.correct { border-color: rgba(46,204,113,0.3); }
  .question-card.wrong { border-color: rgba(231,76,60,0.3); }

  .q-number {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .q-category {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    background: var(--accent2);
    border-radius: 4px;
    color: var(--text-dim);
    margin-left: 8px;
  }
  .q-text {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 16px;
  }
  .q-text .blank {
    display: inline-block;
    min-width: 80px;
    border-bottom: 2px dashed var(--accent);
    color: var(--gold);
    font-weight: 600;
    text-align: center;
    padding: 0 8px;
    margin: 0 2px;
  }

  .input-wrap { position: relative; }
  .q-input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s;
  }
  .q-input:focus { border-color: var(--accent); }
  .q-input:disabled { cursor: not-allowed; opacity: 0.7; }
  .q-input.correct-input { border-color: var(--correct); color: var(--correct); }
  .q-input.wrong-input { border-color: var(--wrong); color: var(--wrong); }

  .answer-hint {
    margin-top: 8px;
    font-size: 13px;
    display: none;
  }
  .answer-hint.show { display: block; }
  .answer-hint .correct-ans { color: var(--correct); }
  .answer-hint .your-ans { color: var(--wrong); }

  .q-result-icon {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 24px;
    display: none;
  }
  .question-card.correct .q-result-icon,
  .question-card.wrong .q-result-icon { display: block; }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 1px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: #fff;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,0.4); }
  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--card-hover); }
  .btn-success {
    background: linear-gradient(135deg, var(--correct), #27ae60);
    color: #fff;
  }
  .btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,204,113,0.4); }

  /* Result Section */
  .result-section {
    text-align: center;
    padding: 40px 20px;
    display: none;
  }
  .result-section.show { display: block; }
  .result-score {
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold), #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-detail {
    color: var(--text-dim);
    margin: 12px 0 24px;
    font-size: 16px;
  }
  .result-emoji {
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* Toggle answers */
  .toggle-answers {
    margin-top: 20px;
    text-align: left;
  }
  .toggle-answers summary {
    cursor: pointer;
    color: var(--text-dim);
    font-size: 14px;
    padding: 8px 0;
  }
  .answer-list {
    list-style: none;
    padding: 12px 0;
  }
  .answer-list li {
    padding: 6px 0;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .answer-list li:last-child { border-bottom: none; }
  .ans-num { color: var(--accent); font-weight: 600; min-width: 40px; display: inline-block; }
  .ans-sep { color: var(--text-dim); margin: 0 8px; }

  /* Footer */
  .footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  /* Category filter */
  .cat-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .cat-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .cat-btn:hover, .cat-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Timer */
  .timer {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .timer span { color: var(--gold); font-weight: 600; }

  /* Responsive */
  @media (max-width: 480px) {
    .header h1 { font-size: 22px; }
    .q-text { font-size: 15px; }
    .btn { padding: 10px 20px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>文学常识每日一练</h1>
    <div class="subtitle">每天10题 · 积累文学知识</div>
    <div class="date-badge" id="dateBadge"></div>

    <div class="stat-item"><div class="stat-num" id="statCorrect">0</div><div class="stat-label">正确数</div></div>

  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="timer" id="timerDisplay">用时：<span id="timerVal">00:00</span></div>

  <div class="cat-filter" id="catFilter"></div>

  <div id="questionsContainer"></div>

  <div class="btn-row" id="btnRow">
    <button class="btn btn-primary" id="submitBtn" onclick="submitAll()">提交答案</button>
    <button class="btn btn-secondary" id="resetBtn" onclick="resetQuiz()">重置</button>
  </div>

  <div class="result-section" id="resultSection">

    <div class="result-score" id="resultScore"></div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="btn-row">

    </div>
    <div class="toggle-answers" id="resultAnswers" style="display:none"></div>
  </div>

  <div class="footer">
    共 138 题 · 先秦 → 秦汉 → 魏晋南北朝 → 唐代 → 宋代 → 元代 → 明代 → 清代
  </div>
</div>

// ==================== 每日选题 ====================
function getDailyQuestions() {
  const today = new Date();
  const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();

  // 日期显示
  const dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
  document.getElementById('dateBadge').textContent = dateStr;

  // 伪随机（基于日期）
  let rng = seed;
  function rand() {
    rng = (rng * 9301 + 49297) % 233280;
    return rng / 233280;
  }

  // Fisher-Yates shuffle
  const shuffled = [...allQuestions];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  return shuffled.slice(0, 10);
}

// ==================== 全局状态 ====================
let dailyQuestions = [];
let answered = [];
let totalCorrect = 0;
let startTime = null;
let timerInterval = null;
let submitted = false;
let currentFilter = '全部';

// ==================== 初始化 ====================
function init() {
  loadProgress();
  if (submitted && dailyQuestions.length > 0) {
    renderQuestions();
    showResult();
  } else {
    startNewQuiz();
  }
  renderCatFilter();
}

function startNewQuiz() {
  dailyQuestions = getDailyQuestions();
  answered = new Array(10).fill(null);
  totalCorrect = 0;
  submitted = false;
  startTime = Date.now();
  saveProgress();
  renderQuestions();
  startTimer();
  document.getElementById('resultSection').classList.remove('show');
  document.getElementById('btnRow').style.display = 'flex';
}

function renderCatFilter() {
  const cats = ['全部', ...new Set(allQuestions.map(q => q.cat))];
  const container = document.getElementById('catFilter');
  container.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === currentFilter ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      currentFilter = cat;
      renderCatFilter();
      renderQuestions();
    };
    container.appendChild(btn);
  });
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  const filtered = currentFilter === '全部'
    ? dailyQuestions.map((q, i) => ({q, i}))
    : dailyQuestions.map((q, i) => ({q, i})).filter(({q}) => q.cat === currentFilter);

  filtered.forEach(({q, i}) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${i}`;

    const answeredState = answered[i];
    let inputHtml, hintHtml = '';

    if (submitted) {
      const isCorrect = checkAnswer(answeredState, q.a);
      card.classList.add(isCorrect ? 'correct' : 'wrong');
      inputHtml = `<input class="q-input ${isCorrect ? 'correct-input' : 'wrong-input'}" value="${answeredState || ''}" disabled>`;
      hintHtml = `<div class="answer-hint show">
        ${!isCorrect ? `<span class="your-ans">你的答案：${answeredState || '（未作答）'}</span><br>` : ''}
        <span class="correct-ans">正确答案：${q.a}</span>
      </div>`;
    } else {
      inputHtml = `<input class="q-input" id="input-${i}" value="${answeredState || ''}"
        placeholder="请输入答案..."
        oninput="saveAnswer(${i})"
        onkeydown="if(event.key==='Enter')checkSingle(${i})">`;
      hintHtml = `<div class="answer-hint" id="hint-${i}"></div>`;
    }

    card.innerHTML = `
      <div class="q-result-icon">${answeredState && submitted ? (checkAnswer(answeredState, q.a) ? '✅' : '❌') : ''}</div>
      <div class="q-number">第 ${i + 1} 题 <span class="q-category">${q.cat}</span></div>
      <div class="q-text">${q.q.replace('____', '<span class="blank">____</span>')}</div>
      <div class="input-wrap">
        ${inputHtml}
        ${hintHtml}
      </div>
      ${!submitted ? `<div style="text-align:right;margin-top:6px"><button class="btn btn-secondary" style="padding:4px 12px;font-size:12px" onclick="checkSingle(${i})">检查本题</button></div>` : ''}
    `;
    container.appendChild(card);
  });

  updateProgress();
}

// ==================== 答案检查 ====================
function checkAnswer(userAns, correctAns) {
  if (!userAns) return false;
  const user = userAns.trim().toLowerCase();
  const correctList = correctAns.split('/').map(a => a.trim().toLowerCase());
  return correctList.includes(user);
}

function saveAnswer(idx) {
  answered[idx] = document.getElementById(`input-${idx}`).value;
  saveProgress();
  updateProgress();
}

function checkSingle(idx) {
  const input = document.getElementById(`input-${idx}`);
  const hint = document.getElementById(`hint-${idx}`);
  const val = input.value.trim();
  if (!val) return;

  const q = dailyQuestions[idx];
  const isCorrect = checkAnswer(val, q.a);
  hint.className = 'answer-hint show';
  hint.innerHTML = isCorrect
    ? `<span class="correct-ans">✅ 回答正确！</span>`
    : `<span class="your-ans">❌ 答案不正确，请继续思考～</span><br><span class="correct-ans">正确答案：${q.a}</span>`;

  input.classList.remove('correct-input', 'wrong-input');
  input.classList.add(isCorrect ? 'correct-input' : 'wrong-input');

  const card = document.getElementById(`card-${idx}`);
  card.classList.remove('correct', 'wrong');
  card.classList.add(isCorrect ? 'correct' : 'wrong');
}

// ==================== 提交 ====================
function submitAll() {
  if (answered.every(a => !a)) {
    alert('你还没有作答任何题目哦！');
    return;
  }

  submitted = true;
  totalCorrect = 0;
  answered.forEach((ans, i) => {
    if (checkAnswer(ans, dailyQuestions[i].a)) totalCorrect++;
  });

  stopTimer();
  saveProgress();
  renderQuestions();
  showResult();
}

function showResult() {
  document.getElementById('btnRow').style.display = 'none';
  const section = document.getElementById('resultSection');
  section.classList.add('show');

  const score = totalCorrect;
  document.getElementById('resultScore').textContent = `${score} / 10`;

  let emoji, detail;
  if (score === 10) { emoji = '🏆'; detail = '满分！文学常识功底扎实！'; }
  else if (score >= 8) { emoji = '🌟'; detail = '优秀！再接再厉！'; }
  else if (score >= 6) { emoji = '👍'; detail = '及格，还有提升空间！'; }
  else if (score >= 4) { emoji = '💪'; detail = '继续加油，多积累！'; }
  else { emoji = '📚'; detail = '需要更多练习哦！'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultDetail').textContent = detail;

  // 生成答案列表
  const answersHtml = dailyQuestions.map((q, i) => {
    const ans = answered[i] || '（未作答）';
    const ok = checkAnswer(answered[i], q.a);
    return `<li><span class="ans-num">第${i+1}题</span> <span class="ans-sep">|</span> <span style="color:${ok?'var(--correct)':'var(--wrong)'}">${ok?'✅':'❌'}</span> 你的答案：${ans} <span style="color:var(--text-dim)">| 正确答案：${q.a}</span></li>`;
  }).join('');

  document.getElementById('resultAnswers').innerHTML = `
    <details class="toggle-answers">
      <summary>📋 查看完整答案</summary>
      <ul class="answer-list">${answersHtml}</ul>
    </details>`;

  // 滚动到结果
  section.scrollIntoView({behavior: 'smooth'});
}

function toggleResultAnswers() {
  const el = document.getElementById('resultAnswers');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ==================== 进度条 ====================
function updateProgress() {
  const done = answered.filter(a => a && a.trim()).length;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statCorrect').textContent = totalCorrect;
  document.getElementById('progressBar').style.width = `${done * 10}%`;
}

// ==================== 计时器 ====================
function startTimer() {
  stopTimer();
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('timerVal').textContent = `${m}:${s}`;
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// ==================== 本地存储 ====================
function saveProgress() {
  const data = {
    date: new Date().toDateString(),
    questions: dailyQuestions,
    answered,
    totalCorrect,
    submitted,
    startTime,
  };
  localStorage.setItem('litQuizProgress', JSON.stringify(data));
}

function loadProgress() {
  const raw = localStorage.getItem('litQuizProgress');
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    // 只恢复当天的进度
    if (data.date === new Date().toDateString()) {
      dailyQuestions = data.questions || [];
      answered = data.answered || [];
      totalCorrect = data.totalCorrect || 0;
      submitted = data.submitted || false;
      startTime = data.startTime || Date.now();
    }
  } catch(e) {}
}

// ==================== 重置 ====================
function resetQuiz() {
  startNewQuiz();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ==================== 启动 ====================
init();
</script>
